name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code.
permissions:
  contents: read

# Node 24 comes with npm 11, the npm that wrote the lock files. npm 10 (Node 22) reads one optional
# peer dependency of the backend differently and stops with "Missing: webpack from lock file".

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Also generates the Prisma client, which the tests import.
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Start PostgreSQL and Mosquitto
        working-directory: .
        run: docker compose up -d --wait
      - name: End-to-end tests
        run: npm run test:e2e

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  simulator:
    name: Simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
